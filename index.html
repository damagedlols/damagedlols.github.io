    /* RESET AND BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    html {
      scroll-behavior: smooth;
      font-size: 16px;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }
 
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--dark-bg);
      color: var(--text-white);
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      width: 100%;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(16, 124, 16, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(255, 170, 0, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.03) 0%, transparent 30%);
    }
 
    /* BACKGROUND EFFECTS */
    .bg-effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -100;
      overflow: hidden;
    }
 
    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, var(--neon-blue), transparent 70%);
      opacity: 0.3;
      animation: float-particle 15s infinite linear;
    }
 
    @keyframes float-particle {
      0% { transform: translateY(0) translateX(0) rotate(0deg); }
      25% { transform: translateY(-100px) translateX(100px) rotate(90deg); }
      50% { transform: translateY(-200px) translateX(0) rotate(180deg); }
      75% { transform: translateY(-100px) translateX(-100px) rotate(270deg); }
      100% { transform: translateY(0) translateX(0) rotate(360deg); }
    }
 
    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(16, 124, 16, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 124, 16, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: -99;
      opacity: 0.3;
    }
 
    /* CUSTOM SCROLLBAR */
    ::-webkit-scrollbar {
      width: 16px;
      height: 16px;
    }
 
    ::-webkit-scrollbar-track {
      background: linear-gradient(180deg, var(--darker-bg), #000000);
      border-radius: 12px;
      border: 3px solid rgba(16, 124, 16, 0.2);
    }
 
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--xbox-green), var(--fortnite-yellow), var(--neon-blue));
      border-radius: 12px;
      border: 3px solid var(--darker-bg);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
 
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--neon-blue), var(--neon-pink), var(--neon-green));
      box-shadow: var(--glow-blue);
      transform: scale(1.05);
      transition: transform 0.3s ease;
    }
 
    ::-webkit-scrollbar-corner {
      background: var(--darker-bg);
    }
 
    /* HEADER */
    .main-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(10, 10, 26, 0.97);
      backdrop-filter: blur(20px);
      border-bottom: 4px solid var(--xbox-green);
      z-index: 10000;
      padding: 18px 0;
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.8);
      transition: all var(--transition-medium);
    }
 
    .header-container {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 35px;
    }
 
    .logo-area {
      display: flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      transition: all var(--transition-medium);
    }
 
    .logo-area:hover {
      transform: translateY(-3px);
    }
 
    .logo-icon {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, var(--xbox-green), #000000);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      border: 4px solid var(--fortnite-yellow);
      box-shadow: 0 0 25px rgba(255, 170, 0, 0.6);
      transition: all var(--transition-medium);
    }
 
    .logo-icon:hover {
      transform: rotate(18deg) scale(1.15);
      box-shadow: 0 0 35px rgba(255, 170, 0, 0.9);
      border-color: var(--neon-blue);
    }
 
    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(90deg, var(--xbox-green), var(--fortnite-yellow), var(--neon-blue), var(--neon-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(16, 124, 16, 0.6);
      letter-spacing: 1.5px;
      animation: logo-glow 3s ease-in-out infinite alternate;
    }
 
    @keyframes logo-glow {
      0% { filter: brightness(1) saturate(1); }
      100% { filter: brightness(1.2) saturate(1.3); }
    }
 
    .logo-tagline {
      font-family: 'Comic Neue', cursive;
      font-size: 15px;
      color: var(--text-gray);
      margin-top: -6px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
 
    /* NAVIGATION */
    .main-nav {
      display: flex;
      gap: 40px;
    }
 
    .nav-item {
      position: relative;
      text-decoration: none;
      color: var(--text-white);
      font-family: 'Comic Neue', cursive;
      font-weight: 800;
      font-size: 19px;
      padding: 10px 0;
      transition: all var(--transition-fast);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
 
    .nav-item::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink), var(--neon-green));
      transition: width var(--transition-medium);
      border-radius: 4px;
      z-index: -1;
    }
 
    .nav-item::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background: var(--fortnite-yellow);
      border-radius: 50%;
      opacity: 0;
      transition: all var(--transition-fast);
      box-shadow: 0 0 10px var(--fortnite-yellow);
    }
 
    .nav-item:hover {
      color: var(--neon-blue);
      transform: translateY(-5px);
      text-shadow: 0 5px 15px rgba(0, 255, 255, 0.5);
    }
 
    .nav-item:hover::before {
      width: 100%;
    }
 
    .nav-item:hover::after {
      opacity: 1;
      bottom: -12px;
    }
 
    .nav-icon {
      margin-right: 12px;
      font-size: 18px;
      transition: all var(--transition-medium);
    }
 
    .nav-item:hover .nav-icon {
      transform: scale(1.3) rotate(15deg);
      color: var(--fortnite-yellow);
    }
 
    .mobile-nav-toggle {
      display: none;
      background: linear-gradient(135deg, var(--xbox-green), #000000);
      border: 3px solid var(--fortnite-yellow);
      color: var(--text-white);
      font-size: 32px;
      cursor: pointer;
      padding: 12px 15px;
      border-radius: 15px;
      transition: all var(--transition-medium);
      box-shadow: 0 0 20px rgba(16, 124, 16, 0.5);
    }
 
    .mobile-nav-toggle:hover {
      transform: rotate(90deg) scale(1.1);
      box-shadow: 0 0 30px rgba(16, 124, 16, 0.8);
      border-color: var(--neon-blue);
    }
 
    /* MAIN CONTENT */
    .main-content {
      margin-top: 130px;
      padding: 35px;
      max-width: 1600px;
      margin-left: auto;
      margin-right: auto;
    }
 
    /* SECTIONS COMMON */
    .content-section {
      margin-bottom: 100px;
      position: relative;
      padding: 25px;
    }
 
    .section-header {
      margin-bottom: 50px;
      text-align: center;
      position: relative;
    }
 
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 20px;
      background: linear-gradient(90deg, var(--xbox-green), var(--fortnite-yellow), var(--neon-blue), var(--neon-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
      letter-spacing: 3px;
      display: inline-block;
      position: relative;
      padding: 0 30px;
      text-shadow: 0 5px 25px rgba(16, 124, 16, 0.3);
    }
 
    .section-title::before,
    .section-title::after {
      content: '⚡';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 36px;
      opacity: 0.8;
      animation: sparkle 2s infinite alternate;
    }
 
    .section-title::before {
      left: -20px;
    }
 
    .section-title::after {
      right: -20px;
    }
 
    @keyframes sparkle {
      0% { opacity: 0.3; transform: translateY(-50%) scale(0.8); }
      100% { opacity: 1; transform: translateY(-50%) scale(1.2); }
    }
 
    .section-subtitle {
      font-family: 'Comic Neue', cursive;
      font-size: 22px;
      color: var(--text-gray);
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.8;
    }
 
    .section-divider {
      width: 300px;
      height: 6px;
      background: linear-gradient(90deg, transparent, var(--xbox-green), var(--fortnite-yellow), transparent);
      margin: 25px auto 50px;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }
 
    .section-divider::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
      animation: shine 3s infinite;
    }
 
    @keyframes shine {
      0% { left: -100%; }
      100% { left: 100%; }
    }
 
    /* HERO SECTION */
    .hero-section {
      background: linear-gradient(135deg, rgba(16, 124, 16, 0.15), rgba(10, 10, 26, 0.95));
      border-radius: 35px;
      padding: 70px 50px;
      border: 4px solid var(--xbox-green);
      box-shadow: 
        0 25px 70px rgba(16, 124, 16, 0.4),
        inset 0 0 60px rgba(255, 170, 0, 0.1);
      position: relative;
      overflow: hidden;
      margin-bottom: 100px;
    }
 
    .hero-section::before {
      content: '';
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: radial-gradient(circle, rgba(255, 170, 0, 0.15) 0%, transparent 70%);
      z-index: -1;
      animation: rotate-bg 60s linear infinite;
    }
 
    @keyframes rotate-bg {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
 
    .hero-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
 
    .hero-text {
      position: relative;
      z-index: 2;
    }
 
    .hero-badge {
      display: inline-block;
      background: linear-gradient(90deg, var(--xbox-green), #000000);
      color: white;
      padding: 12px 25px;
      border-radius: 60px;
      font-family: 'Comic Neue', cursive;
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 25px;
      border: 3px solid var(--fortnite-yellow);
      box-shadow: 0 8px 25px rgba(16, 124, 16, 0.6);
      animation: badge-pulse 3s infinite alternate;
    }
 
    @keyframes badge-pulse {
      0% { box-shadow: 0 8px 25px rgba(16, 124, 16, 0.6); }
      100% { box-shadow: 0 8px 35px rgba(16, 124, 16, 0.9), 0 0 20px rgba(255, 170, 0, 0.5); }
    }
 
    .hero-main-title {
      font-family: 'Bangers', cursive;
      font-size: 82px;
      line-height: 1.1;
      margin-bottom: 25px;
      text-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      letter-spacing: 2px;
    }
 
    .hero-main-title .xbox {
      color: var(--xbox-green);
      text-shadow: var(--glow-green);
      animation: text-float 4s ease-in-out infinite;
    }
 
    .hero-main-title .gamer {
      color: var(--fortnite-yellow);
      text-shadow: var(--glow-yellow);
      animation: text-float 4s ease-in-out infinite 0.5s;
    }
 
    .hero-main-title .creator {
      color: var(--neon-blue);
      text-shadow: var(--glow-blue);
      animation: text-float 4s ease-in-out infinite 1s;

    @keyframes text-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
 
    .hero-description {
      font-size: 22px;
      color: var(--text-light);
      margin-bottom: 35px;
      line-height: 1.8;
      position: relative;
      padding-left: 20px;
      border-left: 4px solid var(--neon-blue);
    }
 
    .hero-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      margin-bottom: 45px;
    }
 
    .highlight-item {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.12);
      padding: 18px 25px;
      border-radius: 15px;
      border-left: 5px solid var(--xbox-green);
      transition: all var(--transition-medium);
      flex: 1 1 200px;
      backdrop-filter: blur(10px);
    }
 
    .highlight-item:hover {
      transform: translateY(-8px) scale(1.05);
      background: rgba(16, 124, 16, 0.2);
      border-left-color: var(--fortnite-yellow);
      box-shadow: 0 10px 30px rgba(16, 124, 16, 0.4);
    }
 
    .highlight-icon {
      color: var(--fortnite-yellow);
      font-size: 24px;
      transition: all var(--transition-medium);
    }
 
    .highlight-item:hover .highlight-icon {
      transform: rotate(15deg) scale(1.3);
      color: var(--neon-blue);
    }
 
    .highlight-text {
      font-weight: 700;
      color: var(--text-white);
      font-size: 18px;
      letter-spacing: 1px;
    }
 
    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
    }
 
    /* BUTTONS */
    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 22px 40px;
      border-radius: 20px;
      font-family: 'Comic Neue', cursive;
      font-weight: 800;
      font-size: 20px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all var(--transition-medium);
      position: relative;
      overflow: hidden;
      z-index: 1;
      min-width: 220px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
 
    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: left 0.8s;
      z-index: -1;
    }
 
    .cta-button:hover::before {
      left: 100%;
    }
 
    .cta-button::after {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink), var(--neon-green), var(--fortnite-yellow));
      z-index: -2;
      border-radius: 23px;
      opacity: 0;
      transition: opacity var(--transition-medium);
    }
 
    .cta-button:hover::after {
      opacity: 1;
    }
 
    .cta-button-primary {
      background: linear-gradient(135deg, var(--xbox-green), #000000);
      color: white;
      border: 4px solid var(--fortnite-yellow);
      box-shadow: 0 15px 40px rgba(16, 124, 16, 0.6);
    }
 
    .cta-button-primary:hover {
      transform: translateY(-12px) scale(1.08);
      box-shadow: 0 20px 50px rgba(16, 124, 16, 0.9), 0 0 30px rgba(255, 170, 0, 0.6);
      border-color: var(--neon-blue);
    }
 
    .cta-button-secondary {
      background: linear-gradient(135deg, var(--fortnite-yellow), #FF6B00);
      color: #000000;
      border: 4px solid var(--xbox-green);
      box-shadow: 0 15px 40px rgba(255, 170, 0, 0.6);
    }
 
    .cta-button-secondary:hover {
      transform: translateY(-12px) scale(1.08);
      box-shadow: 0 20px 50px rgba(255, 170, 0, 0.9), 0 0 30px rgba(16, 124, 16, 0.6);
      border-color: var(--neon-pink);
    }
 
    .cta-button-outline {
      background: transparent;
      color: var(--text-white);
      border: 4px solid var(--neon-blue);
      box-shadow: 0 15px 40px rgba(0, 255, 255, 0.25);
    }
 
    .cta-button-outline:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 50px rgba(0, 255, 255, 0.5);
      background: rgba(0, 255, 255, 0.15);
      border-color: var(--neon-green);
    }
 
    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }
 
    .xbox-visual {
      width: 100%;
      max-width: 550px;
      position: relative;
      transform-style: preserve-3d;
      animation: console-float 6s ease-in-out infinite;
    }
 
    @keyframes console-float {
      0%, 100% { transform: translateY(0) rotateX(0); }
      50% { transform: translateY(-20px) rotateX(5deg); }
    }
 
    .console-graphic {
      width: 100%;
      height: 350px;
      background: linear-gradient(135deg, #000000, #1a1a1a, #000000);
      border-radius: 25px;
      position: relative;
      border: 6px solid var(--xbox-green);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.9),
        inset 0 0 50px rgba(16, 124, 16, 0.3);
      overflow: hidden;
      transform: translateZ(20px);
    }
 
    .console-screen {
      position: absolute;
      top: 25px;
      left: 25px;
      right: 25px;
      height: 220px;
      background: linear-gradient(135deg, #0a0a1a, #000000);
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 3px solid rgba(16, 124, 16, 0.5);
    }
 
    .screen-content {
      text-align: center;
      color: var(--neon-green);
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      text-shadow: 0 0 15px var(--neon-green);
      animation: screen-glow 2s infinite alternate;
      letter-spacing: 3px;
    }
 
    @keyframes screen-glow {
      0% { opacity: 0.7; text-shadow: 0 0 8px var(--neon-green); filter: brightness(0.8); }
      100% { opacity: 1; text-shadow: 0 0 20px var(--neon-green), 0 0 35px var(--neon-green); filter: brightness(1.2); }
    }
 
    .console-buttons {
      position: absolute;
      bottom: 30px;
      left: 25px;
      right: 25px;
      display: flex;
      justify-content: space-around;
    }
 
    .console-button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #333333, #000000, #333333);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--xbox-green);
      font-size: 28px;
      border: 4px solid var(--xbox-green);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      transition: all var(--transition-medium);
      cursor: pointer;
    }
 
    .console-button:hover {
      transform: translateY(-8px) scale(1.2);
      color: var(--fortnite-yellow);
      border-color: var(--fortnite-yellow);
      box-shadow: 0 15px 35px rgba(255, 170, 0, 0.7);
    }
 
    /* ABOUT SECTION */
    .about-section {
      background: var(--card-bg);
      border-radius: 35px;
      padding: 60px;
      border: 4px solid var(--card-border);
      box-shadow: 
        0 25px 70px rgba(0, 0, 0, 0.6),
        inset 0 0 50px rgba(100, 100, 255, 0.1);
      margin-bottom: 100px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(15px);
    }
 
    .about-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--xbox-green), var(--fortnite-yellow), var(--neon-blue), var(--neon-pink));
      z-index: 2;
    }
 
    .about-section::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 170, 0, 0.1) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      z-index: -1;
      animation: pulse 8s infinite alternate;
    }
 
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
    }
 
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: start;
      position: relative;
      z-index: 1;
    }
 
    .about-text-content {
      position: relative;
    }
 
    .about-intro {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 35px;
      line-height: 1.5;
      position: relative;
      padding-bottom: 20px;
    }
 
    .about-intro::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, var(--fortnite-yellow), transparent);
      border-radius: 4px;
    }
 
    .about-intro .highlight {
      color: var(--fortnite-yellow);
      text-shadow: 0 0 15px rgba(255, 170, 0, 0.7);
      position: relative;
      display: inline-block;
    }
 
    .about-intro .highlight::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--fortnite-yellow), transparent);
      border-radius: 3px;
    }
 
    .about-details {
      font-size: 20px;
      color: var(--text-light);
      line-height: 1.9;
      margin-bottom: 35px;
    }
 
    .about-details p {
      margin-bottom: 25px;
      position: relative;
      padding-left: 25px;
    }
 
    .about-details p::before {
      content: '▶';
      position: absolute;
      left: 0;
      top: 0;
      color: var(--neon-blue);
      font-size: 16px;
      animation: blink 2s infinite;
    }
 
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
 
    .fun-facts {
      background: linear-gradient(135deg, rgba(16, 124, 16, 0.15), rgba(255, 170, 0, 0.1));
      border-radius: 20px;
      padding: 30px;
      border-left: 6px solid var(--fortnite-yellow);
      margin-top: 40px;
      position: relative;
      overflow: hidden;
    }
 
    .fun-facts::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0 L100,0 L100,100 L0,100 Z" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/></svg>');
      background-size: 20px;
      opacity: 0.3;
    }
 
    .fun-facts-title {
      font-family: 'Comic Neue', cursive;
      font-size: 28px;
      color: var(--fortnite-yellow);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
 
    .fun-facts-title i {
      font-size: 32px;
      animation: star-spin 4s linear infinite;
    }
 
    @keyframes star-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
 
    .fun-facts-list {
      list-style: none;
    }
 
    .fun-fact-item {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
      color: var(--text-light);
      font-size: 18px;
      transition: all var(--transition-fast);
      padding: 12px;
      border-radius: 10px;
    }
 
    .fun-fact-item:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(10px);
      padding-left: 20px;
    }
 
    .fact-icon {
      color: var(--neon-blue);
      font-size: 22px;
      min-width: 30px;
      text-align: center;
      transition: all var(--transition-medium);
    }
 
    .fun-fact-item:hover .fact-icon {
      transform: scale(1.5) rotate(15deg);
      color: var(--neon-pink);
    }
 
    .about-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }
 
    .stat-card {
      background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(10, 10, 26, 0.95));
      border-radius: 25px;
      padding: 35px;
      border: 3px solid var(--card-border);
      transition: all var(--transition-medium);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(10px);
    }
 
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.05) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.8s;
    }
 
    .stat-card:hover::before {
      transform: translateX(100%);
    }
 
    .stat-card:hover {
      transform: translateY(-15px) scale(1.05);
      border-color: var(--fortnite-yellow);
      box-shadow: 0 20px 50px rgba(255, 170, 0, 0.4), 0 0 30px rgba(16, 124, 16, 0.3);
    }
 
    .stat-icon-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--xbox-green), #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      font-size: 40px;
      color: white;
      border: 4px solid var(--fortnite-yellow);
      position: relative;
      z-index: 1;
      transition: all var(--transition-medium);
    }
 
    .stat-card:hover .stat-icon-wrapper {
      transform: rotate(15deg) scale(1.1);
      border-color: var(--neon-blue);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
    }
 
    .stat-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 52px;
      font-weight: 900;
      color: var(--neon-blue);
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
      position: relative;
    }
 
    .stat-number::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
      border-radius: 3px;
    }
 
    .stat-label {
      font-family: 'Comic Neue', cursive;
      font-size: 22px;
      color: var(--text-gray);
      letter-spacing: 1.5px;
    }
 
    /* GAMES SECTION */
    .games-section {
      margin-bottom: 100px;
    }
 
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 35px;
      margin-top: 50px;
    }
 
    .game-card {
      background: linear-gradient(135deg, rgba(30, 30, 60, 0.95), rgba(15, 15, 40, 0.95));
      border-radius: 30px;
      padding: 35px;
      border: 4px solid transparent;
      transition: all var(--transition-medium);
      position: relative;
      overflow: hidden;
      height: 100%;
      backdrop-filter: blur(10px);
    }
 
    .game-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 10px;
      z-index: 2;
    }
 
    .game-card.fortnite::before {
      background: linear-gradient(90deg, var(--fortnite-yellow), #FF6B00, #FFAA00);
    }
 
    .game-card.minecraft::before {
      background: linear-gradient(90deg, var(--minecraft-green), #00AA00, #55FF55);
    }
 
    .game-card.cod::before {
      background: linear-gradient(90deg, var(--cod-orange), #8B0000, #FF6B00);
    }
 
    .game-card.rdr::before {
      background: linear-gradient(90deg, var(--rdr-red), #8B0000, #B22222);
    }
 
    .game-card:hover {
      transform: translateY(-20px) scale(1.05);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 255, 255, 0.3);
      border-color: var(--neon-blue);
    }
 
    .game-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.05) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.8s;
    }
 
    .game-card:hover::after {
      transform: translateX(100%);
    }
 
    .game-logo {
      font-size: 80px;
      margin-bottom: 30px;
      text-align: center;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
 
    .game-logo i {
      position: relative;
      z-index: 1;
      transition: all var(--transition-medium);
    }
 
    .game-card:hover .game-logo i {
      transform: scale(1.2) rotate(15deg);
      filter: drop-shadow(0 0 20px currentColor);
    }
 
    .game-title {
      font-family: 'Bangers', cursive;
      font-size: 38px;
      color: var(--text-white);
      margin-bottom: 20px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
      padding-bottom: 15px;
    }
 
    .game-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
      border-radius: 4px;
    }
 
    .game-description {
      color: var(--text-light);
      font-size: 18px;
      line-height: 1.8;
      text-align: center;
      margin-bottom: 25px;
    }
 
    .game-status {
      margin-top: 25px;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      text-align: center;
      font-size: 16px;
      color: var(--text-gray);
      border-left: 5px solid var(--neon-blue);
      transition: all var(--transition-medium);
    }
 
    .game-card:hover .game-status {
      background: rgba(0, 255, 255, 0.15);
      color: var(--text-white);
      border-left-color: var(--fortnite-yellow);
      transform: translateX(10px);
    }
 
    /* SETUP SECTION */
    .setup-section {
      background: var(--card-bg);
      border-radius: 35px;
      padding: 60px;
      border: 4px solid var(--card-border);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6);
      margin-bottom: 100px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(15px);
    }
 
    .setup-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      margin-top: 50px;
    }
 
    .setup-main {
      position: relative;
    }
 
    .setup-image {
      width: 100%;
      height: 400px;
      background: linear-gradient(135deg, #000000, #1a1a1a, #000000);
      border-radius: 25px;
      border: 6px solid var(--xbox-green);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 120px;
      color: var(--xbox-green);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      margin-bottom: 35px;
      position: relative;
      overflow: hidden;
      transition: all var(--transition-medium);
    }
 
    .setup-image:hover {
      transform: perspective(1000px) rotateX(5deg) rotateY(-5deg);
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.9), 0 0 40px rgba(16, 124, 16, 0.5);
      border-color: var(--fortnite-yellow);
    }
 
    .setup-image::after {
      content: 'XBOX SERIES X';
      position: absolute;
      bottom: 25px;
      color: var(--fortnite-yellow);
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      text-shadow: 0 0 15px rgba(255, 170, 0, 0.7);
      letter-spacing: 3px;
    }
 
    .setup-specs {
      background: linear-gradient(135deg, rgba(16, 124, 16, 0.15), rgba(255, 170, 0, 0.1));
      border-radius: 25px;
      padding: 30px;
      border: 3px solid var(--xbox-green);
      transition: all var(--transition-medium);
    }
 
    .setup-specs:hover {
      transform: translateY(-10px);
      border-color: var(--neon-blue);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
 
    .specs-title {
      font-family: 'Comic Neue', cursive;
      font-size: 28px;
      color: var(--fortnite-yellow);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
 
    .specs-title i {
      font-size: 32px;
      animation: chip-blink 3s infinite alternate;
    }
 
    @keyframes chip-blink {
      0%, 100% { color: var(--fortnite-yellow); }
      50% { color: var(--neon-blue); }
    }
 
    .specs-list {
      list-style: none;

    .spec-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;

      transition: all var(--transition-fast);

      padding-left: 15px;
      border-bottom-color: rgba(0, 255, 255, 0.3);

    .spec-item:last-child {
      border-bottom: none;
    }
 
    .spec-label {
      color: var(--text-gray);
      font-size: 18px;
      font-weight: 600;
    }
 
    .spec-value {
      color: var(--text-white);

    .game-play-card.zombieapocalypse .game-play-button {
      background: linear-gradient(135deg, var(--zombie-green), #000000);
      border-color: var(--bio-green);
    }
 
    .game-play-card.racingextreme .game-play-button {
      background: linear-gradient(135deg, var(--racing-red), #000000);
      border-color: var(--laser-red);
    }
 
    .game-play-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.7s;
      z-index: -1;
    }
 
    .game-play-button:hover::before {
      left: 100%;
    }
 
    .game-play-button:hover {
      transform: translateY(-8px);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(255, 51, 102, 0.5);
    }
 
    .game-play-button i {
      font-size: 24px;
      transition: all var(--transition-medium);
    }
 
    .game-play-button:hover i {
      transform: scale(1.3) rotate(15deg);
      animation: button-icon-spin 1s linear infinite;
    }
 
    @keyframes button-icon-spin {
      0% { transform: scale(1.3) rotate(15deg); }
      100% { transform: scale(1.3) rotate(375deg); }
    }
 
    /* GAME CONTAINER */
    .game-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      z-index: 20000;
      overflow: hidden;
    }
 
    .game-container.active {
      display: block;
      animation: game-fade-in 0.5s ease-out;
    }
 
    @keyframes game-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
 
    .game-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
    }
 
    .game-title-display {
      font-family: 'Creepster', cursive;
      font-size: 42px;
      color: white;
      text-shadow: 
        0 0 20px var(--euphoria-purple),
        0 0 40px var(--euphoria-purple);
      letter-spacing: 3px;
    }
 
    .game-controls {
      display: flex;
      gap: 20px;
    }
 
    .game-button {
      padding: 18px 35px;
      background: linear-gradient(135deg, var(--game-red), #000000);
      color: white;
      border: 3px solid var(--neon-blue);
      border-radius: 15px;
      font-family: 'Comic Neue', cursive;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      transition: all var(--transition-medium);
      display: flex;
      align-items: center;
      gap: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
 
    .game-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(255, 51, 102, 0.6);
      border-color: var(--neon-pink);
    }
 
    .game-canvas-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 100px 20px 20px;
    }
 
    #gameCanvas {
      max-width: 100%;
      max-height: 100%;
      background: #000;
      display: block;
      border: 4px solid var(--euphoria-purple);
      border-radius: 15px;
      box-shadow: 
        0 0 50px rgba(138, 43, 226, 0.5),
        inset 0 0 30px rgba(138, 43, 226, 0.3);
    }
 
    /* GAME INFO PANEL */
    .game-info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 15px;
      border: 3px solid var(--neon-blue);
      width: 300px;
      backdrop-filter: blur(10px);
      z-index: 11;
    }
 
    .game-info-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      color: var(--neon-blue);
      margin-bottom: 15px;
      text-align: center;
    }
 
    .game-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
 
    .game-stat {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }
 
    .game-stat-label {
      font-size: 12px;
      color: var(--text-gray);
      margin-bottom: 5px;
    }
 
    .game-stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      color: var(--neon-green);
      font-weight: 700;
    }
 
    .game-controls-help {
      color: var(--text-gray);
      font-size: 14px;
      line-height: 1.5;
    }
 
    /* FOOTER */
    .main-footer {
      background: linear-gradient(180deg, #000000, #0a0a1a);
      border-top: 6px solid var(--xbox-green);
      padding: 70px 0 40px;
      margin-top: 100px;
      position: relative;
      overflow: hidden;
    }
 
    .main-footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 10% 20%, rgba(16, 124, 16, 0.1) 0%, transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(255, 170, 0, 0.1) 0%, transparent 30%);
      z-index: -1;
    }
 
    .footer-content {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 35px;
    }
 
    .footer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 60px;
      margin-bottom: 60px;
    }
 
    .footer-column {
      position: relative;
    }
 
    .footer-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      color: var(--text-white);
      margin-bottom: 30px;
      position: relative;
      padding-bottom: 15px;
    }
 
    .footer-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, var(--xbox-green), var(--fortnite-yellow));
      border-radius: 4px;
    }
 
    .footer-links {
      list-style: none;
    }
 
    .footer-link-item {
      margin-bottom: 20px;
    }
 
    .footer-link {
      color: var(--text-gray);
      text-decoration: none;
      font-size: 18px;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 15px;
      padding: 8px 0;
      position: relative;
    }
 
    .footer-link::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--neon-blue), transparent);
      transition: width var(--transition-medium);
    }
 
    .footer-link:hover {
      color: var(--neon-blue);
      transform: translateX(10px);
    }
 
    .footer-link:hover::before {
      width: 100%;
    }
 
    .footer-about {
      color: var(--text-light);
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 30px;
    }
 
    .footer-social-links {
      display: flex;
      gap: 20px;
      margin-top: 25px;
    }
 
    .footer-social-link {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: var(--text-white);
      text-decoration: none;
      transition: all var(--transition-medium);
      position: relative;
      overflow: hidden;
    }
 
    .footer-social-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--xbox-green);
      border-radius: 50%;
      transform: scale(0);
      transition: transform var(--transition-medium);
      z-index: -1;
    }
 
    .footer-social-link:hover {
      transform: translateY(-10px) scale(1.1);
      color: white;
    }
 
    .footer-social-link:hover::before {
      transform: scale(1);
    }
 
    .footer-newsletter {
      margin-top: 30px;
    }
 
    .newsletter-text {
      color: var(--text-gray);
      font-size: 18px;
      margin-bottom: 20px;
    }
 
    .newsletter-form {
      display: flex;
      gap: 15px;
    }
 
    .newsletter-input {
      flex: 1;
      padding: 18px 25px;
      border-radius: 60px;
      border: 3px solid var(--xbox-green);
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-white);
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      transition: all var(--transition-medium);
    }
 
    .newsletter-input:focus {
      outline: none;
      border-color: var(--neon-blue);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
    }
 
    .newsletter-button {
      padding: 18px 35px;
      border-radius: 60px;
      border: none;
      background: linear-gradient(135deg, var(--xbox-green), #000000);
      color: white;
      font-family: 'Comic Neue', cursive;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      transition: all var(--transition-medium);
      border: 3px solid var(--fortnite-yellow);
    }
 
    .newsletter-button:hover {
      transform: scale(1.08);
      box-shadow: 0 15px 40px rgba(16, 124, 16, 0.6);
      border-color: var(--neon-blue);
    }
 
    .footer-bottom {
      text-align: center;
      padding-top: 40px;
      border-top: 3px solid rgba(255, 255, 255, 0.1);
      color: var(--text-gray);
      font-size: 16px;
      position: relative;
    }
 
    .footer-bottom::before {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
    }
 
    .footer-bottom a {
      color: var(--neon-blue);
      text-decoration: none;
      transition: all var(--transition-fast);
    }
 
    .footer-bottom a:hover {
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }
 
    /* RESPONSIVE DESIGN */
    @media (max-width: 1400px) {
      .header-container, .main-content, .footer-content {
        padding: 0 30px;
      }
   
      .hero-main-title {
        font-size: 70px;
      }
   
      .section-title {
        font-size: 48px;
      }
   
      .footer-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 50px;
      }
    }
 
    @media (max-width: 1200px) {
      .hero-content, .about-grid, .setup-content {
        grid-template-columns: 1fr;
        gap: 50px;
      }
   
      .hero-main-title {
        font-size: 60px;
      }
   
      .section-title {
        font-size: 42px;
      }
   
      .games-play-grid {
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      }
    }
 
    @media (max-width: 992px) {
      .main-nav {
        display: none;
        position: fixed;
        top: 100px;
        left: 0;
        width: 100%;
        background: rgba(10, 10, 26, 0.98);
        backdrop-filter: blur(20px);
        flex-direction: column;
        padding: 40px;
        gap: 30px;
        border-bottom: 4px solid var(--xbox-green);
        z-index: 9999;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      }
   
      .main-nav.active {
        display: flex;
      }
   
      .mobile-nav-toggle {
        display: block;
      }
   
      .hero-main-title {
        font-size: 52px;
      }
   
      .section-title {
        font-size: 38px;
      }
   
      .games-grid, .schedule-grid, .social-grid, .games-play-grid {
        grid-template-columns: 1fr;
      }
   
      .footer-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }
 
    @media (max-width: 768px) {
      .hero-main-title {
        font-size: 42px;
      }
   
      .section-title {
        font-size: 32px;
      }
   
      .games-play-title {
        font-size: 48px;
      }
   
      .about-stats {
        grid-template-columns: 1fr;
      }
   
      .hero-buttons {
        flex-direction: column;
        align-items: stretch;
      }
   
      .cta-button {
        min-width: auto;
        width: 100%;
      }
   
      .newsletter-form {
        flex-direction: column;
      }
   
      .schedule-tabs {
        flex-direction: column;
        align-items: center;
      }
   
      .schedule-tab {
        width: 100%;
        max-width: 300px;
      }
   
      .game-controls {
        flex-direction: column;
        gap: 10px;
      }
   
      .game-button {
        padding: 15px 25px;
        font-size: 16px;
      }
    }
 
    @media (max-width: 576px) {
      .header-container, .main-content, .footer-content {
        padding: 0 20px;
      }
   
      .hero-main-title {
        font-size: 36px;
      }
   
      .section-title {
        font-size: 28px;
      }
   
      .games-play-title {
        font-size: 36px;
      }
   
      .hero-section, .about-section, .setup-section, .games-play-section {
        padding: 40px 25px;
      }
   
      .cta-button, .game-play-button, .schedule-tab, .game-button {
        padding: 18px 25px;
        font-size: 16px;
      }
   
      .console-buttons {
        justify-content: space-between;
        padding: 0 10px;
      }
   
      .console-button {
        width: 55px;
        height: 55px;
        font-size: 22px;
      }
    }
 
    /* ANIMATION CLASSES */
    .fade-in {
      animation: fadeIn 1s ease-out;
    }
 
    .slide-in-left {
      animation: slideInLeft 1s ease-out;
    }
 
    .slide-in-right {
      animation: slideInRight 1s ease-out;
    }
 
    .slide-in-up {
      animation: slideInUp 1s ease-out;
    }
 
    .slide-in-down {
      animation: slideInDown 1s ease-out;
    }
 
    .pulse {
      animation: pulse
