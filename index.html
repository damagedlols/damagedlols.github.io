<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aideninamovie</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #080808;
      --card: #111111;
      --border: #1e1e1e;
      --gold: #c8a96e;
      --gold-light: #e2c98a;
      --white: #f5f0e8;
      --muted: #6a6460;
      --yt-red: #ff3c3c;
      --tt-cyan: #69c9d0;
      --ig-pink: #e1306c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Film grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 100;
      opacity: 0.35;
      mix-blend-mode: overlay;
    }

    /* Spotlight */
    .spotlight {
      position: fixed;
      top: -300px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(ellipse at 50% 0%, rgba(200,169,110,0.13) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Film strips */
    .film-strip {
      position: fixed;
      top: 0; bottom: 0;
      width: 28px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 4px;
      z-index: 1;
      opacity: 0.18;
    }
    .film-strip.left { left: 0; }
    .film-strip.right { right: 0; }
    .film-hole {
      width: 20px;
      height: 14px;
      border-radius: 3px;
      background: transparent;
      border: 1.5px solid var(--gold);
      flex-shrink: 0;
    }

    /* Layout */
    .wrapper {
      position: relative;
      z-index: 2;
      max-width: 520px;
      margin: 0 auto;
      padding: 70px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 52px;
      animation: fadeDown 0.9s cubic-bezier(0.16,1,0.3,1) both;
    }
    .avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
    }
    .avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(var(--gold), var(--gold-light), var(--gold), transparent 60%, transparent 70%, var(--gold));
      animation: spin 8s linear infinite;
    }
    .avatar-inner {
      position: relative;
      z-index: 1;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      overflow: hidden;
    }
    .clapper-svg { width: 52px; height: 52px; }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 12px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: 0.85;
    }
    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(42px, 10vw, 62px);
      letter-spacing: 5px;
      line-height: 1;
      color: var(--white);
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .name span { color: var(--gold); }
    .bio {
      font-size: 13.5px;
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.5px;
      max-width: 320px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      margin-bottom: 30px;
      animation: fadeUp 1s 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }
    .divider-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.6;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      width: 100%;
      margin-bottom: 16px;
      animation: fadeUp 1s 0.35s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* Cards */
    .cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      text-decoration: none;
      color: var(--white);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
      animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) both;
    }
    .card:nth-child(1) { animation-delay: 0.40s; }
    .card:nth-child(2) { animation-delay: 0.48s; }
    .card:nth-child(3) { animation-delay: 0.56s; }
    .card:nth-child(4) { animation-delay: 0.64s; }
    .card:nth-child(5) { animation-delay: 0.72s; }
    .card:nth-child(6) { animation-delay: 0.80s; }

    /* Shine sweep */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
      transition: left 0.5s ease;
    }
    .card:hover::before { left: 160%; }

    /* Left accent bar */
    .card::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 4px 0 0 4px;
      background: var(--accent-color, var(--gold));
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover::after { opacity: 1; }
    .card:hover {
      transform: translateY(-2px) scale(1.005);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    /* Platform colours */
    .card.youtube    { --accent-color: var(--yt-red); }
    .card.youtube:hover  { border-color: rgba(255,60,60,0.25); }
    .card.tiktok     { --accent-color: var(--tt-cyan); }
    .card.tiktok:hover   { border-color: rgba(105,201,208,0.25); }
    .card.discord    { --accent-color: #5865F2; }
    .card.discord:hover  { border-color: rgba(88,101,242,0.25); }
    .card.twitch     { --accent-color: #9146FF; }
    .card.twitch:hover   { border-color: rgba(145,70,255,0.25); }
    .card.instagram  { --accent-color: var(--ig-pink); }
    .card.instagram:hover { border-color: rgba(225,48,108,0.25); }

    .icon-wrap {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .card:hover .icon-wrap { background: rgba(255,255,255,0.07); }
    .icon-wrap svg { width: 22px; height: 22px; }

    .card-text { flex: 1; min-width: 0; }
    .card-platform {
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow {
      color: var(--muted);
      transition: color 0.3s, transform 0.3s;
      flex-shrink: 0;
    }
    .card:hover .arrow { color: var(--gold); transform: translateX(3px); }

    /* Footer */
    .footer {
      margin-top: 58px;
      text-align: center;
      animation: fadeUp 1s 1.0s cubic-bezier(0.16,1,0.3,1) both;
    }
    .footer-rule { width: 40px; height: 1px; background: var(--border); margin: 0 auto 18px; }
    .footer-text {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.5;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .film-strip { display: none; }
      .wrapper { padding: 50px 18px 60px; }
    }
  </style>
</head>
