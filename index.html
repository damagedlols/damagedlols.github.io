<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damaged Gaming - Social Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
        }

        /* Header */
        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(180deg, #1a0000 0%, #000 100%);
            border-bottom: 3px solid #ff0000;
        }

        .main-title {
            font-size: 3em;
            color: #ff0000;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #fff;
            margin-bottom: 20px;
        }

        .anime-badges {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .badge {
            padding: 10px 20px;
            background: #ff0000;
            color: #fff;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Social Media Section */
        .section-title {
            font-size: 2em;
            text-align: center;
            margin-bottom: 30px;
            color: #ff0000;
            text-transform: uppercase;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .social-card {
            background: #1a1a1a;
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .social-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.3);
        }

        .social-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .platform-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 10px;
        }

        .social-username {
            font-size: 1.1em;
            color: #ccc;
            margin-bottom: 20px;
        }

        .follow-btn {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }

        .follow-btn:hover {
            background: #cc0000;
        }

        .follow-btn:active {
            background: #990000;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            background: #1a1a1a;
            border-top: 3px solid #ff0000;
            margin-top: 40px;
        }

        .footer-text {
            font-size: 1em;
            color: #ccc;
            margin-bottom: 10px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1em;
            }

            .section-title {
                font-size: 1.5em;
            }

            .social-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff0000;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="main-title">DAMAGED GAMING</h1>
        <p class="subtitle">Your Gaming & Anime Hub</p>
        <div class="anime-badges">
            <div class="badge">⚔️ Demon Slayer</div>
            <div class="badge">🏴‍☠️ One Piece</div>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">Connect With Me</h2>
        <div class="social-grid">
            <!-- YouTube Main -->
            <div class="social-card">
                <div class="social-icon">📺</div>
                <div class="platform-name">YouTube</div>
                <div class="social-username">@Sv1-um9xt</div>
                <button class="follow-btn" onclick="window.open('https://www.youtube.com/@Sv1-um9xt', '_blank')">
                    Subscribe
                </button>
            </div>

            <!-- YouTube Second -->
            <div class="social-card">
                <div class="social-icon">📺</div>
                <div class="platform-name">YouTube #2</div>
                <div class="social-username">@Damagedlol</div>
                <button class="follow-btn" onclick="window.open('https://www.youtube.com/@Damagedlol', '_blank')">
                    Subscribe
                </button>
            </div>

            <!-- TikTok -->
            <div class="social-card">
                <div class="social-icon">🎵</div>
                <div class="platform-name">TikTok</div>
                <div class="social-username">@damagedgamin0_o</div>
                <button class="follow-btn" onclick="window.open('https://www.tiktok.com/@damagedgamin0_o', '_blank')">
                    Follow
                </button>
            </div>

            <!-- Instagram -->
            <div class="social-card">
                <div class="social-icon">📸</div>
                <div class="platform-name">Instagram</div>
                <div class="social-username">@damagedgaminglol</div>
                <button class="follow-btn" onclick="window.open('https://www.instagram.com/damagedgaminglol', '_blank')">
                    Follow
                </button>
            </div>

            <!-- Twitch -->
            <div class="social-card">
                <div class="social-icon">🎮</div>
                <div class="platform-name">Twitch</div>
                <div class="social-username">@damagedlols</div>
                <button class="follow-btn" onclick="window.open('https://www.twitch.tv/damagedlols', '_blank')">
                    Follow
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p class="footer-text">⚔️ Damaged Gaming ⚔️</p>
        <p class="footer-text">Demon Slayer x One Piece</p>
    </footer>
</body>
</html>
