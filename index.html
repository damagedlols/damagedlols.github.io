<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiden | Content Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF0080;
            --secondary: #7928CA;
            --accent: #00F0FF;
            --dark: #0A0E27;
            --darker: #050714;
            --light: #FFFFFF;
            --gray: #8892B0;
        }

        body {
            font-family: 'Archivo', sans-serif;
            background: var(--darker);
            color: var(--light);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background gradient mesh */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(121, 40, 202, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 128, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 240, 255, 0.2) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(5%, -5%) rotate(120deg); }
            66% { transform: translate(-5%, 5%) rotate(240deg); }
        }

        /* Noise texture overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 100;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }

        /* Header section */
        header {
            padding: 6rem 0 4rem;
            text-align: center;
            position: relative;
        }

        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 400;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            animation: titleReveal 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards;
            opacity: 0;
            text-shadow: 0 0 80px rgba(255, 0, 128, 0.5);
        }

        @keyframes titleReveal {
            0% {
                opacity: 0;
                transform: translateY(50px);
                letter-spacing: 0.5em;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                letter-spacing: 0.1em;
            }
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--gray);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 1rem;
            font-weight: 300;
            animation: fadeInUp 1s ease 0.3s forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        /* Social links grid */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin: 6rem 0;
            padding: 2rem 0;
        }

        .social-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 3rem 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            animation: cardSlideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        .social-card:nth-child(1) { animation-delay: 0.1s; }
        .social-card:nth-child(2) { animation-delay: 0.2s; }
        .social-card:nth-child(3) { animation-delay: 0.3s; }
        .social-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardSlideIn {
            from {
                opacity: 0;
                transform: translateY(60px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .social-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                var(--card-color-1) 0%, 
                var(--card-color-2) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .social-card:hover::before {
            opacity: 0.1;
        }

        .social-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .social-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--card-color-1) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: all 0.6s ease;
        }

        .social-card:hover::after {
            width: 300px;
            height: 300px;
            opacity: 0.15;
        }

        /* Individual card colors */
        .tiktok-card {
            --card-color-1: #00f2ea;
            --card-color-2: #ff0050;
        }

        .instagram-card {
            --card-color-1: #833AB4;
            --card-color-2: #FD1D1D;
        }

        .youtube-card {
            --card-color-1: #FF0000;
            --card-color-2: #FF6B6B;
        }

        .youtube-extra-card {
            --card-color-1: #9B59B6;
            --card-color-2: #3498DB;
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .icon-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--card-color-1), var(--card-color-2));
            opacity: 0.15;
            transition: all 0.4s ease;
        }

        .social-card:hover .icon-bg {
            opacity: 0.3;
            transform: scale(1.2) rotate(45deg);
        }

        .social-icon {
            width: 50px;
            height: 50px;
            position: relative;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .social-card:hover .social-icon {
            transform: scale(1.1) rotate(-5deg);
        }

        .card-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 0.08em;
            color: var(--light);
            margin: 0;
            transition: all 0.3s ease;
        }

        .social-card:hover .card-title {
            background: linear-gradient(135deg, var(--card-color-1), var(--card-color-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-handle {
            color: var(--gray);
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        .social-card:hover .card-handle {
            color: var(--light);
        }

        .card-cta {
            margin-top: auto;
            padding: 0.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--light);
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .social-card:hover .card-cta {
            background: linear-gradient(135deg, var(--card-color-1), var(--card-color-2));
            border-color: transparent;
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 4rem 0 3rem;
            margin-top: 4rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-text {
            color: var(--gray);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        .footer-accent {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* Decorative elements */
        .floating-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            opacity: 0.3;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: 10%;
            right: -100px;
            animation: float 20s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--secondary);
            bottom: 20%;
            left: -50px;
            animation: float 15s ease-in-out infinite reverse;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: var(--accent);
            top: 60%;
            right: 10%;
            animation: float 18s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 30px) scale(0.9);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 4rem 0 2rem;
            }

            .social-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                margin: 3rem 0;
            }

            .container {
                padding: 0 1.5rem;
            }

            .floating-orb {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }


    </style>
</head>
<body>
    <!-- Decorative floating orbs -->
    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    <div class="floating-orb orb-3"></div>

    <div class="container">
        <header>
            <div class="glitch-wrapper">
                <h1>AIDEN</h1>
            </div>
            <p class="subtitle">Content Creator & Streamer</p>
        </header>

        <main>
            <div class="social-grid">
                <!-- TikTok Card -->
                <a href="https://www.tiktok.com/@aideninamovie" target="_blank" rel="noopener noreferrer" class="social-card tiktok-card">

                        <div class="icon-bg"></div>

                <!-- Instagram Card -->
                <a href="https://www.instagram.com/aideninamovie/" target="_blank" rel="noopener noreferrer" class="social-card instagram-card">
                    <div class="icon-wrapper">
                        <div class="icon-bg"></div>
                        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">

                        </svg>
                    </div>
                    <h2 class="card-title">Instagram</h2>
                    <p class="card-handle">@aideninamovie</p>
                    <span class="card-cta">Follow Me</span>
                </a>

                <!-- YouTube Main Card -->
                <a href="https://www.youtube.com/@Sv1-um9xt" target="_blank" rel="noopener noreferrer" class="social-card youtube-card">

                <a href="https://www.youtube.com/@Damagedlol" target="_blank" rel="noopener noreferrer" class="social-card youtube-extra-card">

        <footer>
            <p class="footer-text">
                Made with <span class="footer-accent">passion</span> for the community
            </p>
        </footer>
    </div>

    <script>
        // Add micro-interactions to cards
        const cards = document.querySelectorAll('.social-card');
        cards.forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.setProperty('--rotation', Math.random() * 4 - 2 + 'deg');
            });
        });

        // Parallax effect on scroll
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    const scrolled = window.pageYOffset;
                    const orbs = document.querySelectorAll('.floating-orb');
                    orbs.forEach((orb, index) => {
                        const speed = 0.5 + (index * 0.2);
                        orb.style.transform = `translateY(${scrolled * speed}px)`;
                    });
                    ticking = false;
                });
                ticking = true;
            }
        });
    </script>
</body>
</html>
